.legend-item { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px; }
.legend-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
.legend-label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.legend-count { color:#777; font-size:11px; }
#stats { padding:10px 14px; border-top:1px solid #2a2a4e; font-size:11px; color:#888; }
.neighbor-link { display:block; padding:2px 6px; margin:2px 0; border-radius:3px; cursor:pointer; font-size:12px; border-left:3px solid #333; }
.neighbor-link:hover { background:#2a2a4e; }

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({id:n.id,label:n.label,color:n.color,size:n.size,font:n.font,title:n.title,_community:n.community,_community_name:n.community_name,_source_file:n.source_file,_file_type:n.file_type,_degree:n.degree})));
const edgesDS = new vis.DataSet(RAW_EDGES.map((e,i)=>({id:i,from:e.from,to:e.to,label:'',title:e.title,dashes:e.dashes,width:e.width,color:e.color,arrows:{to:{enabled:true,scaleFactor:.45}}})));
const network = new vis.Network(document.getElementById('graph'), {nodes:nodesDS,edges:edgesDS}, {physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-80,centralGravity:.005,springLength:130,springConstant:.08,damping:.4,avoidOverlap:.8},stabilization:{iterations:250,fit:true}},interaction:{hover:true,tooltipDelay:100,hideEdgesOnDrag:true},nodes:{shape:'dot',borderWidth:1.5},edges:{smooth:{type:'continuous',roundness:.2},selectionWidth:3}});
const legend = document.getElementById('legend');
LEGEND.forEach(item => { const div=document.createElement('div'); div.className='legend-item'; div.innerHTML=`<span class="legend-dot" style="background:${item.color}"></span><span class="legend-label">${esc(item.label)}</span><span class="legend-count">${item.count}</span>`; legend.appendChild(div); });
const info = document.getElementById('info-content');
function showNode(id) { const n = RAW_NODES.find(x=>x.id===id); if(!n) return; const connected = edgesDS.get().filter(e=>e.from===id||e.to===id).map(e=>e.from===id?e.to:e.from); const names = connected.map(cid=>RAW_NODES.find(x=>x.id===cid)).filter(Boolean); info.innerHTML = `<div><b>${esc(n.label)}</b></div><div>Community: ${esc(n.community_name)}</div><div>Source: <code>${esc(n.source_file)}</code></div><div>Degree: ${n.degree}</div><div style="margin-top:8px"><b>Neighbors</b></div>` + names.map(x=>`<span class="neighbor-link" onclick="focusNode('${x.id}')">${esc(x.label)}</span>`).join(''); }
function focusNode(id) { network.selectNodes([id]); network.focus(id, {scale:1.2, animation:true}); showNode(id); }
network.on('click', params => { if(params.nodes.length) showNode(params.nodes[0]); });
const search = document.getElementById('search'); const results=document.getElementById('search-results');
search.addEventListener('input', () => { const q=search.value.toLowerCase().trim(); if(!q){results.style.display='none'; return;} const matches=RAW_NODES.filter(n=>n.label.toLowerCase().includes(q)).slice(0,20); results.innerHTML=matches.map(n=>`<div class="search-item" onclick="focusNode('${n.id}')">${esc(n.label)}</div>`).join(''); results.style.display=matches.length?'block':'none'; });
